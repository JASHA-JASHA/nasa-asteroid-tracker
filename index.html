<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <title>NASA Space Command Center</title>
    <style>
        body { background: #020208; font-family: monospace; color: white; padding: 20px; text-align: center; }
        .card { background: rgba(10,20,40,0.8); border-radius: 8px; padding: 15px; margin-bottom: 20px; }
        .nasa { border: 2px solid #00ff00; } .iss { border: 2px solid #00d2ff; } .mars { border: 2px solid #ff3333; }
    </style>
</head>
<body>

    <div class="card nasa">
        <h2>NASA SPACE COMMAND CENTER</h2>
        <p>இன்று பூமியைக் கடக்கும் விண்கற்கள்: <strong style="color:#00ff00; font-size:24px;">18</strong></p>
    </div>

    <div class="card iss">
        <h2>LIVE ISS TELEMETRY</h2>
        <p>LAT: <span id="lat" style="color:#00d2ff;">Loading...</span></p>
        <p>LNG: <span id="lng" style="color:#00d2ff;">Loading...</span></p>
    </div>

    <div class="card mars">
        <h2>MARS ROVER FEED</h2>
        <img src="https://unsplash.com" style="width:100%; max-height:200px; object-fit:cover; border-radius:5px;">
    </div>

    <script>
        async function getISS() {
            try {
                const res = await fetch('https://wheretheiss.at');
                const data = await res.json();
                document.getElementById('lat').innerText = parseFloat(data.latitude).toFixed(4) + "° N";
                document.getElementById('lng').innerText = parseFloat(data.longitude).toFixed(4) + "° E";
            } catch (e) { document.getElementById('lat').innerText = "Offline"; }
        }
        getISS(); setInterval(getISS, 3000);
    </script>
</body>
</html>
